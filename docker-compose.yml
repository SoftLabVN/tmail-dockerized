services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tmail-app
    restart: always
    ports:
      - "${APP_PORT:-8090}:80"
    environment:
      - APP_NAME=${APP_NAME:-TMail}
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-https://imail.edu.vn}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-tmail}
      - DB_USERNAME=${DB_USERNAME:-tmail}
      - DB_PASSWORD=${DB_PASSWORD:-tmail_secret_password}
      - SESSION_DRIVER=database
      - AUTO_INSTALL=${AUTO_INSTALL:-true}
      - TMAIL_ENGINE=${TMAIL_ENGINE:-delivery}
      - DEFAULT_DOMAIN=${DEFAULT_DOMAIN:-imail.edu.vn}
      - DEFAULT_THEME=${DEFAULT_THEME:-default}
      - ADMIN_NAME=${ADMIN_NAME:-Peter Tuan Anh}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-anhptt@softlab.vn}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@123456}
    volumes:
      - tmail_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tmail-network

  db:
    image: mariadb:10.11
    container_name: tmail-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-tmail_root_password}
      - MYSQL_DATABASE=${DB_DATABASE:-tmail}
      - MYSQL_USER=${DB_USERNAME:-tmail}
      - MYSQL_PASSWORD=${DB_PASSWORD:-tmail_secret_password}
    volumes:
      - tmail_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - tmail-network

volumes:
  tmail_storage:
    driver: local
  tmail_db_data:
    driver: local

networks:
  tmail-network:
    driver: bridge
